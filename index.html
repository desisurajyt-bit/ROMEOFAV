<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Segmented International Scoreboard v14.4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Mono:wght@700&family=Roboto:wght@400;700;900&display=swap');

        :root {
            --home-bg: #cc0000;
            --home-txt: #ffffff;
            --away-bg: #ffcc00;
            --away-txt: #006633;
            --timer-bg: #051a30;
            --panel-bg: #1a1a1a;
        }

        body { margin: 0; padding: 40px; font-family: 'Roboto', sans-serif; background: transparent; overflow: hidden; }

        /* --- SCOREBOARD LAYOUT --- */
        .scoreboard-master {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            margin-left: 60px;
            margin-top: 20px;
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.4));
        }

        .main-horizontal-bar {
            display: flex;
            align-items: center;
            height: 65px;
            background-color: #ffffff;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        /* Widened Flag Boxes for Widescreen Adjustment */
        .flag-box {
            height: 100%;
            width: 120px; /* Increased to 120px to give wide flags room to adjust */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent; 
            padding: 4px; 
            box-sizing: border-box;
        }

        .flag-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Keeps the entire flag visible without cutting it off */
        }

        /* Compressed TLA Code Boxes */
        .tla-box {
            height: 100%;
            width: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 46px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        /* Center Score Blocks */
        .score-block {
            height: 100%;
            width: 75px;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 52px;
            box-sizing: border-box;
        }

        .score-block.home-side {
            border-right: 1px solid #333333;
        }

        /* Hanging Bottom Clock */
        .hanging-timer-box {
            background-color: var(--timer-bg);
            color: #ffffff;
            font-family: 'Roboto Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            padding: 4px 20px;
            min-width: 90px;
            text-align: center;
            border-bottom-left-radius: 3px;
            border-bottom-right-radius: 3px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
            margin-top: -1px;
            letter-spacing: -0.5px;
            box-sizing: border-box;
        }

        /* --- CONTROL PANEL --- */
        .controller { background: #222222; color: #ddd; padding: 25px; border-radius: 10px; width: 960px; margin: 60px auto; border: 1px solid #444; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-family: sans-serif; }
        .control-box { border: 1px solid #444; padding: 15px; border-radius: 6px; background: #2d2d2d; }
        h3 { margin-top: 0; font-size: 13px; text-transform: uppercase; color: #999; border-bottom: 1px solid #555; padding-bottom: 8px; margin-bottom: 15px;}
        .input-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .input-row label { width: 150px; }
        input[type="text"], input[type="number"] { padding: 6px; border: 1px solid #555; border-radius: 4px; background: #1a1a1a; color: white; }
        input[type="color"] { border: none; width: 45px; height: 26px; background: transparent; cursor: pointer; }
        .short { width: 65px; text-align: center; }
        .full { flex-grow: 1; }
        .button-zone { grid-column: span 2; display: flex; gap: 12px; justify-content: center; }
        button { padding: 12px 25px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; text-transform: uppercase; transition: 0.2s; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        .btn-reset { background: #6c757d; color: white; }
        .btn-copy { background: #007bff; color: white; }
    </style>
</head>
<body>

    <div class="scoreboard-master">
        <div class="main-horizontal-bar">
            <div class="flag-box">
                <img id="ui-h-flag" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='65'></svg>">
            </div>
            <div id="ui-h-name" class="tla-box">VIE</div>
            <div id="ui-h-score" class="score-block home-side">0</div>
            <div id="ui-a-score" class="score-block">0</div>
            <div id="ui-a-name" class="tla-box">AUS</div>
            <div class="flag-box">
                <img id="ui-a-flag" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='65'></svg>">
            </div>
        </div>

        <div id="ui-timer" class="hanging-timer-box">LIVE</div>
    </div>

    <div class="controller">
        <div class="control-box">
            <h3>Match Timing Config</h3>
            <div class="input-row"><label>Manual (Min:Sec):</label><input type="number" id="cfg-m" class="short" value="0"> : <input type="number" id="cfg-s" class="short" value="0"></div>
            <div class="input-row"><label>Auto Kickoff (HH:MM):</label><input type="number" id="cfg-sh" class="short" placeholder="HH"> : <input type="number" id="cfg-sm" class="short" placeholder="MM"></div>
        </div>
        <div class="control-box">
            <h3>Teams & Scores</h3>
            <div class="input-row"><label>Home (Code/Score):</label><input type="text" id="cfg-hn" class="short" value="VIE"> <input type="number" id="cfg-hg" class="short" value="0"></div>
            <div class="input-row"><label>Away (Code/Score):</label><input type="text" id="cfg-an" class="short" value="AUS"> <input type="number" id="cfg-ag" class="short" value="0"></div>
        </div>
        <div class="control-box">
            <h3>Dynamic Visual Styling</h3>
            <div class="input-row"><label>Home Panel Colors:</label><input type="color" id="clr-h-bg" value="#cc0000">&nbsp;<input type="color" id="clr-h-tx" value="#ffffff"></div>
            <div class="input-row"><label>Away Panel Colors:</label><input type="color" id="clr-a-bg" value="#ffcc00">&nbsp;<input type="color" id="clr-a-tx" value="#006633"></div>
            <div class="input-row"><label>Timer BG Color:</label><input type="color" id="clr-t-bg" value="#051a30"></div>
        </div>
        <div class="control-box">
            <h3>External Media Assets</h3>
            <div class="input-row"><label>Home Flag Panel URL:</label><input type="text" id="cfg-hf" class="full" placeholder="https://..."></div>
            <div class="input-row"><label>Away Flag Panel URL:</label><input type="text" id="cfg-af" class="full" placeholder="https://..."></div>
        </div>
        <div class="button-zone">
            <button class="btn-start" onclick="startTimer()">START CLOCK</button>
            <button class="btn-stop" onclick="stopTimer()">STOP CLOCK</button>
            <button class="btn-reset" onclick="resetAll()">RESET ALL</button>
        </div>
        <div class="button-zone">
            <button class="btn-copy" onclick="copyURL()">Copy Synchronized Source Link</button>
        </div>
    </div>

    <script>
        let totalSecs = 0; let matchInterval = null; let isStarted = false; let manualStartMinutes = 0;

        function updateUI() {
            document.getElementById('ui-h-name').innerText = document.getElementById('cfg-hn').value.toUpperCase(); 
            document.getElementById('ui-a-name').innerText = document.getElementById('cfg-an').value.toUpperCase();
            
            document.getElementById('ui-h-score').innerText = document.getElementById('cfg-hg').value; 
            document.getElementById('ui-a-score').innerText = document.getElementById('cfg-ag').value;
            
            const homeFlagUrl = document.getElementById('cfg-hf').value;
            const awayFlagUrl = document.getElementById('cfg-af').value;
            document.getElementById('ui-h-flag').src = homeFlagUrl ? homeFlagUrl : "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='65'></svg>"; 
            document.getElementById('ui-a-flag').src = awayFlagUrl ? awayFlagUrl : "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='65'></svg>";

            const homeBg = document.getElementById('clr-h-bg').value;
            const homeTx = document.getElementById('clr-h-tx').value;
            const awayBg = document.getElementById('clr-a-bg').value;
            const awayTx = document.getElementById('clr-a-tx').value;
            const timerBg = document.getElementById('clr-t-bg').value;

            const hBox = document.getElementById('ui-h-name');
            hBox.style.backgroundColor = homeBg;
            hBox.style.color = homeTx;

            const aBox = document.getElementById('ui-a-name');
            aBox.style.backgroundColor = awayBg;
            aBox.style.color = awayTx;

            document.getElementById('ui-timer').style.backgroundColor = timerBg;

            if (!isStarted) { 
                document.getElementById('ui-timer').innerText = "LIVE"; 
                totalSecs = (parseInt(document.getElementById('cfg-m').value) || 0) * 60 + (parseInt(document.getElementById('cfg-s').value) || 0); 
            } else { 
                let m = Math.floor(totalSecs / 60); let rs = totalSecs % 60; let pad = (v) => v < 10 ? "0"+v : v;
                let label = "";
                if (totalSecs >= 5400) { label = "90+"+pad(m-90)+":"+pad(rs); if (totalSecs > 7200) label = "FT"; } 
                else if (totalSecs > 2700 && manualStartMinutes < 45) { label = "45+"+pad(m-45)+":"+pad(rs); }
                else { label = pad(m)+":"+pad(rs); }
                document.getElementById('ui-timer').innerText = label; 
            }
        }

        function copyURL() {
            const params = new URLSearchParams({
                hn: document.getElementById('cfg-hn').value, an: document.getElementById('cfg-an').value,
                hg: document.getElementById('cfg-hg').value, ag: document.getElementById('cfg-ag').value,
                hf: document.getElementById('cfg-hf').value, af: document.getElementById('cfg-af').value,
                hbg: document.getElementById('clr-h-bg').value, htx: document.getElementById('clr-h-tx').value,
                abg: document.getElementById('clr-a-bg').value, atx: document.getElementById('clr-a-tx').value,
                tbg: document.getElementById('clr-t-bg').value,
                sh: document.getElementById('cfg-sh').value, sm: document.getElementById('cfg-sm').value,
                mm: document.getElementById('cfg-m').value, ms: document.getElementById('cfg-s').value
            });
            const fullURL = window.location.href.split('?')[0] + '?' + params.toString();
            const textArea = document.createElement("textarea"); textArea.value = fullURL; document.body.appendChild(textArea); textArea.select();
            document.execCommand('copy'); document.body.removeChild(textArea);
            alert("Dual OBS Stream Sync Link Copied!");
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('hn')) {
                document.getElementById('cfg-hn').value = urlParams.get('hn'); document.getElementById('cfg-an').value = urlParams.get('an');
                document.getElementById('cfg-hg').value = urlParams.get('hg'); document.getElementById('cfg-ag').value = urlParams.get('ag');
                document.getElementById('cfg-hf').value = urlParams.get('hf'); document.getElementById('cfg-af').value = urlParams.get('af');
                document.getElementById('clr-h-bg').value = urlParams.get('hbg') || "#cc0000"; document.getElementById('clr-h-tx').value = urlParams.get('htx') || "#ffffff";
                document.getElementById('clr-a-bg').value = urlParams.get('abg') || "#ffcc00"; document.getElementById('clr-a-tx').value = urlParams.get('atx') || "#006633";
                document.getElementById('clr-t-bg').value = urlParams.get('tbg') || "#051a30";
                document.getElementById('cfg-sh').value = urlParams.get('sh') || ""; document.getElementById('cfg-sm').value = urlParams.get('sm') || "";
                document.getElementById('cfg-m').value = urlParams.get('mm') || 0; document.getElementById('cfg-s').value = urlParams.get('ms') || 0;
            }
            updateUI();
        };

        function startTimer() { if (matchInterval) return; isStarted = true; manualStartMinutes = parseInt(document.getElementById('cfg-m').value) || 0; totalSecs = manualStartMinutes * 60 + (parseInt(document.getElementById('cfg-s').value) || 0); matchInterval = setInterval(() => { totalSecs++; updateUI(); document.getElementById('cfg-m').value = Math.floor(totalSecs/60); document.getElementById('cfg-s').value = totalSecs%60; }, 1000); }
        function stopTimer() { clearInterval(matchInterval); matchInterval = null; }
        function resetAll() { stopTimer(); isStarted = false; manualStartMinutes = 0; totalSecs = 0; document.getElementById('cfg-m').value = 0; document.getElementById('cfg-s').value = 0; updateUI(); }
        
        setInterval(() => { 
            let h = document.getElementById('cfg-sh').value; let m = document.getElementById('cfg-sm').value; 
            if (h !== "" && m !== "" && !isStarted) { 
                let now = new Date(); if (now.getHours() == h && now.getMinutes() == m) startTimer(); 
            } 
        }, 1000);
        setInterval(updateUI, 200);
    </script>
</body>
</html>
